<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrader - Login</title>
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> -->
     <link rel="stylesheet" href="{{ url_for('static', filename='create_account.css') }}">
</head>
<body>
    <div class="launcher-container">
        <div class="hero-section">
            <div class="logo">GAMIFY</div>
            <div class="hero-text">
                <h1>Very Fast.<br>Reliable.<br>Gamify!</h1>
                <button class="video-btn">▶ Watch Video</button>
            </div>
            <div class="language-picker">
                <div class="lang-item active">🇷🇺 Russian</div>
                <div class="lang-item">🇺🇸 English</div>
                <div class="lang-item">🇪🇸 Spanish</div>
            </div>
        </div>

        <div class="auth-section">
            <div class="login-box">
                <h2>Sign in to account</h2>
                <p>Enter password from account or reset it</p>


                <!-- form for user -->
                <form action="/login" method="POST">
    <div class="input-wrapper">
        <input type="email" placeholder="daiver20@yandex.ua" required>
        <span class="edit-icon">✏️</span>
    </div>
    
    <div class="input-wrapper">
        <input type="password" placeholder="••••••••••••" required>
        <span class="view-icon">👁️</span>
    </div>

    <button type="submit" class="submit-btn">Continue</button>

    <div class="separator">or</div>
    
    <a href="{{ url_for('login_google') }}" class="google-btn">
        <div class="google-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px">
                <path fill="#fbc02d" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                <path fill="#e53935" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                <path fill="#4caf50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                <path fill="#1565c0" d="M43.611,20.083L43.611,20.083L42,20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
            </svg>
        </div>
        <span class="btn-text">Sign in with Google</span>
    </a>
</form>

<!-- form endes here -->

                <div class="social-login">
                    <p>Or via social networks</p>
                    <div class="icons">
                        <span class="icon red">Y</span>
                        <span class="icon blue">V</span>
                        <span class="icon white">G</span>
                        <span class="icon dark-blue">f</span>
                    </div>
                </div>

                <div class="auth-footer">
                    <a href="#">Login problems?</a>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='create_account.js') }}"></script>
</body>
</html>
